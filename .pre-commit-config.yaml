repos:
  # Stage 1: SCA
  - repo: local
    hooks:
      - id: npm-audit
        name: SCA (NPM Audit)
        entry: npm audit --production
        language: system
        pass_filenames: false

  # Stage 2: Linting & Formatting (Standard Hooks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.agent|\.claude|\.github|\.specify|dist|node_modules|threat_modelling)/|^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|package-lock\.json|pnpm-lock\.yaml)$
      - id: end-of-file-fixer
        exclude: ^(\.agent|\.claude|\.github|\.specify|dist|node_modules|threat_modelling)/|^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|package-lock\.json|pnpm-lock\.yaml)$

  # Stage 2: Linting & Formatting (Local Hooks)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^(\.agent|\.claude|\.github|\.specify|dist|node_modules|threat_modelling)/|^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|package-lock\.json|pnpm-lock\.yaml)$

  # Stage 3: Code Quality (Standard Hooks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        exclude: ^(\.agent|\.claude|\.github|\.specify|dist|node_modules|threat_modelling)/|^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|package-lock\.json|pnpm-lock\.yaml)$
      - id: check-added-large-files

  # Stage 3: Code Quality (Local Hooks) & Stages 4, 5, 6
  - repo: local
    hooks:
      # Stage 3: Code Quality - JavaScript/TypeScript
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        files: \.(js|jsx|ts|tsx)$
        exclude: ^(\.agent|\.claude|\.github|\.specify|dist|node_modules|threat_modelling)/
        pass_filenames: false

      # Stage 3: Code Quality - Go Formatting
      - id: gofmt
        name: Go Format
        entry: gofmt -w
        language: system
        files: \.go$
        pass_filenames: true

      # Stage 3: Code Quality - Go Linting
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd go && golangci-lint run --fix'
        language: system
        files: \.go$
        pass_filenames: false

      # Stage 3: Code Quality - Go Vet
      - id: go-vet
        name: Go Vet
        entry: bash -c 'cd go && go vet ./...'
        language: system
        files: \.go$
        pass_filenames: false

      # Stage 4: Unit Tests - JavaScript/TypeScript
      - id: unit-tests
        name: Unit Tests (JS/TS)
        entry: npm test
        language: system
        pass_filenames: false

      # Stage 4: Unit Tests - Go
      - id: go-test
        name: Unit Tests (Go)
        entry: bash -c 'cd go && go test -v -race -coverprofile=coverage.out ./...'
        language: system
        files: \.go$
        pass_filenames: false

      # Stage 5: SAST
      - id: semgrep
        name: Semgrep (SAST Polyglot)
        entry: semgrep --config=p/security-audit --error
        language: python
        additional_dependencies: ["semgrep"]
        pass_filenames: false

      # Stage 6: Threat Modelling
      - id: pytm
        name: Threat Modelling (pytm)
        entry: python3 threat_modelling/tm.py --seq
        language: system
        pass_filenames: false

  # Stage 5: SAST (Additional)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.json|pnpm-lock.yaml|package-lock.json|.*\.tsbuildinfo
