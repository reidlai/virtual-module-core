name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
          cache-dependency-path: go/go.mod

      - name: Install Dependencies
        run: |
          npm install
          pip install pytm semgrep detect-secrets
          cd go && go mod download

      # Stage 1: SCA
      - name: SCA - NPM Audit
        run: npm audit --production
        continue-on-error: true

      # Stage 2: Linting & Formatting
      - name: Lint - Prettier
        run: npx prettier --check .
        continue-on-error: true

      # Stage 3: Code Quality - JavaScript/TypeScript
      - name: Quality - ESLint
        run: npm run lint

      # Stage 3: Code Quality - Go
      - name: Quality - Go Format Check
        run: |
          cd go
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run 'gofmt -w .' to fix."
            gofmt -l .
            exit 1
          fi

      - name: Quality - golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go
          args: --timeout=5m

      - name: Quality - Go Vet
        run: cd go && go vet ./...

      # Stage 4: Unit Tests - JavaScript/TypeScript
      - name: Test - Unit Tests (JS/TS)
        run: npm test

      # Stage 4: Unit Tests - Go
      - name: Test - Unit Tests (Go)
        run: |
          cd go
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      # Stage 5: SAST
      - name: SAST - Semgrep
        run: semgrep --config=p/security-audit --error .
        continue-on-error: true

      - name: SAST - Detect Secrets
        run: detect-secrets scan --baseline .secrets.baseline
        continue-on-error: true

      # Stage 6: Threat Modeling
      - name: Threat Model - PyTM
        run: python3 threat_modelling/tm.py --seq
